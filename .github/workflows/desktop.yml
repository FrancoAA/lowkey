# Desktop app builds on real machines: Linux (AppImage, .deb, .rpm), Windows (installer .exe,
# .msi) and macOS on Apple Silicon (.dmg). The installers are left as downloads ("artifacts")
# on each run. Unsigned: Windows SmartScreen and macOS Gatekeeper warn on first start.
name: Desktop builds

on:
  push:
    branches: [master, feat/tauri-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # AppImage tools run without FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux packages (WebKitGTK, tray, Vulkan for whisper.cpp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libvulkan-dev glslc spirv-headers libssl-dev

      - name: Linux build inputs (Vulkan SDK layout, checked sherpa-onnx archive)
        if: runner.os == 'Linux'
        run: |
          ./desktop/scripts/vulkan-sdk.sh
          ./desktop/scripts/sherpa-onnx.sh

      - name: Page (Vite)
        working-directory: frontend
        run: npm ci

      - name: App and installers
        working-directory: desktop
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: open-whisper-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
