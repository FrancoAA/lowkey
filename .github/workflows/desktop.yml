# Desktop app builds on real machines: Linux (AppImage, .deb, .rpm), Windows (installer .exe,
# .msi) and macOS on Apple Silicon (.dmg). The installers are left as downloads ("artifacts")
# on each run. Unsigned: Windows SmartScreen and macOS Gatekeeper warn on first start.
#
# A version tag (v0.3.0) also makes a GitHub Release with every installer attached. The tag
# must match the app's version (desktop/src-tauri/tauri.conf.json and Cargo.toml). Put
# "[release]" in the version commit's message: then only the tag's run builds it.
name: Desktop builds

on:
  push:
    branches: [master, feat/tauri-desktop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # A release commit ("[release]" in its message) builds once, from its tag, not twice.
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # AppImage tools run without FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # macOS: whisper.cpp uses std::filesystem (macOS 10.15+); Apple Silicon starts at 11.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' desktop/src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          echo "tag $tag, tauri.conf.json $conf, Cargo.toml $cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] || { echo "::error::tag v$tag does not match the app's version ($conf / $cargo)"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux packages (WebKitGTK, tray, Vulkan for whisper.cpp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libvulkan-dev glslc spirv-headers libssl-dev libasound2-dev

      - name: Linux build inputs (Vulkan SDK layout, checked sherpa-onnx archive)
        if: runner.os == 'Linux'
        run: |
          ./desktop/scripts/vulkan-sdk.sh
          ./desktop/scripts/sherpa-onnx.sh

      - name: Page (Vite)
        working-directory: frontend
        run: npm ci

      - name: App and installers
        working-directory: desktop
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: open-whisper-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

  # A version tag: one release with the installers of all three systems.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          mapfile -t files < <(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) | sort)
          [ "${#files[@]}" -ge 6 ] || { echo "::error::expected 6 or more installers, found ${#files[@]}"; exit 1; }
          notes="Installers for Linux (AppImage, .deb, .rpm), Windows (.exe installer, .msi) and macOS on Apple Silicon (.dmg).
          They are not signed: Windows SmartScreen asks once (More info → Run anyway); on macOS run
          \`xattr -dr com.apple.quarantine /Applications/open-whisper.app\` after copying the app."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "open-whisper ${GITHUB_REF_NAME#v}" \
            --notes "$notes" --generate-notes "${files[@]}"
