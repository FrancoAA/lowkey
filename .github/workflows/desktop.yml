# Desktop app builds on real machines: Linux (AppImage, .deb, .rpm), Windows (installer .exe,
# .msi) and macOS on Apple Silicon (.dmg). The installers are left as downloads ("artifacts")
# on each run. Unsigned: Windows SmartScreen and macOS Gatekeeper warn on first start.
#
# A version tag (v0.3.0) also makes a GitHub Release with every installer attached. The tag
# must match the app's version (desktop/src-tauri/tauri.conf.json and Cargo.toml). Put
# "[release]" in the version commit's message: then only the tag's run builds it.
# Linux and Windows are required for a release; macOS is not: GitHub's macOS arm64 runners
# are sometimes not available for hours ("not acquired by Runner"), and the release then
# goes out without the .dmg and says so.
name: Desktop builds

on:
  push:
    branches: [master, feat/tauri-desktop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # A release commit ("[release]" in its message) builds once, from its tag, not twice.
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ggml_native: whisper.cpp's GGML_NATIVE. ON builds it for the runner's own CPU. The x64
          # runners can have AVX-512, and then the app stops with an illegal instruction on a
          # PC without it (most Intel desktop CPUs, AMD before Zen 4) when it first transcribes.
          # OFF builds for AVX2 (Intel 2013+, all AMD Ryzen). macOS keeps ON: the runners are
          # Apple M1, the oldest Apple Silicon.
          # features: Windows builds whisper.cpp with Vulkan (the GPU; src/gpu.rs).
          - name: Linux x64
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            ggml_native: "OFF"
            features: ""
          - name: Windows x64
            os: windows-latest
            bundles: nsis,msi
            ggml_native: "OFF"
            features: windows-gpu
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            ggml_native: "ON"
            features: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # AppImage tools run without FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # macOS: whisper.cpp uses std::filesystem (macOS 10.15+); Apple Silicon starts at 11.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Windows: the Vulkan SDK for whisper.cpp's GPU build (headers, glslc, vulkan-1.lib).
      VULKAN_SDK_VERSION: "1.4.341.1"
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' desktop/src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          echo "tag $tag, tauri.conf.json $conf, Cargo.toml $cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ] || { echo "::error::tag v$tag does not match the app's version ($conf / $cargo)"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # The runner image (with its Visual Studio version) is part of the cache's name: a cached
      # CMakeCache.txt of whisper.cpp keeps the compiler paths of the image that made it, and
      # fails on a newer one ("CMAKE_ASM_COMPILER … is not a full path": 2026-11-19 and -20).
      # Windows: the build folder is C:\t. whisper.cpp's Vulkan build makes a tool in a folder
      # deep inside cargo's, and MSBuild's file tracker cannot write a path longer than 259
      # characters (FTK1011: 274 under desktop\src-tauri\target).
      - name: Runner image and build folder
        id: image
        run: |
          echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"
            echo "target=C:/t" >> "$GITHUB_OUTPUT"
          else
            echo "target=desktop/src-tauri/target" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Windows: the build folder is outside the workspace (above).
          cache-targets: ${{ runner.os != 'Windows' }}
          cache-directories: ${{ runner.os == 'Windows' && 'C:\t' || '' }}
          # Part of the cache's name. Also change it when a whisper.cpp build setting changes:
          # whisper-rs-sys does not build again when a GGML_* variable changes.
          key: ggml-native-${{ matrix.ggml_native }}-${{ steps.image.outputs.version }}-z7

      # Windows: the cache keeps all of C:\t, with the installers of the run that saved it. A release
      # must not get an old version's installer, so the bundle folder starts empty.
      - name: No old installers (Windows)
        if: runner.os == 'Windows'
        run: rm -rf "${{ steps.image.outputs.target }}/release/bundle"

      - name: Linux packages (WebKitGTK, tray, Vulkan for whisper.cpp)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libvulkan-dev glslc spirv-headers libssl-dev libasound2-dev

      - name: Linux build inputs (Vulkan SDK layout, checked sherpa-onnx archive)
        if: runner.os == 'Linux'
        run: |
          ./desktop/scripts/vulkan-sdk.sh
          ./desktop/scripts/sherpa-onnx.sh

      # The SDK installer is 300 MB: the installed SDK is kept in a cache by its version.
      - name: Vulkan SDK cache (Windows)
        if: runner.os == 'Windows'
        id: vulkan
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          Start-Process -Wait -NoNewWindow -FilePath $exe -ArgumentList "--root", "C:\VulkanSDK\$env:VULKAN_SDK_VERSION", "--accept-licenses", "--default-answer", "--confirm-command", "install"

      - name: Vulkan SDK path (Windows)
        if: runner.os == 'Windows'
        run: |
          ls "/c/VulkanSDK/${VULKAN_SDK_VERSION}/Lib/vulkan-1.lib" "/c/VulkanSDK/${VULKAN_SDK_VERSION}/Bin/glslc.exe"
          echo "VULKAN_SDK=$(cygpath -w "/c/VulkanSDK/${VULKAN_SDK_VERSION}")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "/c/VulkanSDK/${VULKAN_SDK_VERSION}/Bin")" >> "$GITHUB_PATH"

      - name: Page (Vite)
        working-directory: frontend
        run: npm ci

      - name: Page tests (Vitest, the demo stand-in)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm test

      # Windows: not stripped, and with debug info (-Z7 for whisper.cpp's C and C++; not /Z7: Git
      # Bash turns that into a path. Line tables for Rust), so the linker also writes lowkey.pdb;
      # the exe does not change. A crash report gives addresses as lowkey.exe+0x…, and the
      # release's debug symbols file turns them into function names and lines.
      - name: App and installers
        working-directory: desktop
        env:
          GGML_NATIVE: ${{ matrix.ggml_native }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ runner.os == 'Windows' && 'false' || 'true' }}
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'Windows' && 'line-tables-only' || 'false' }}
          CFLAGS: ${{ runner.os == 'Windows' && '-Z7' || '' }}
          CXXFLAGS: ${{ runner.os == 'Windows' && '-Z7' || '' }}
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Debug symbols (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.image.outputs.target }}/release
        shell: pwsh
        run: |
          $version = (Get-Content "$env:GITHUB_WORKSPACE\desktop\src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force bundle/symbols | Out-Null
          Compress-Archive -Force -Path lowkey.pdb, lowkey.exe -DestinationPath "bundle/symbols/Lowkey_${version}_x64-debug-symbols.zip"
          Get-Item bundle/symbols/*.zip | Format-Table Name, Length

      # The speech engine's device check (src/gpu.rs) on a runner without a GPU: the CPU, and no
      # abort (Linux: the Vulkan loader without a driver). Windows also without vulkan-1.dll (as
      # on a PC with no GPU driver): it must still start, and say so.
      - name: Devices
        working-directory: ${{ steps.image.outputs.target }}/release
        run: |
          exe=./lowkey
          [ -f lowkey.exe ] && exe=./lowkey.exe
          "$exe" --devices | tee devices.txt
          grep -q '^Speech engine: ' devices.txt
          if [ "$RUNNER_OS" = Windows ]; then
            OPENWHISPER_NO_GPU=1 "$exe" --devices | tee devices.txt
            grep -q '^Speech engine: CPU' devices.txt
            grep -q 'vulkan-1.dll (the Vulkan loader) not loaded' devices.txt
          fi

      # The crash handlers on each system (src/crash.rs): the built app stops on an illegal
      # instruction on purpose (as on a CPU without an instruction set that whisper.cpp uses),
      # and --crash-report must find that crash in the log.
      - name: Crash report
        working-directory: ${{ steps.image.outputs.target }}/release
        run: |
          exe=./lowkey
          [ -f lowkey.exe ] && exe=./lowkey.exe
          if "$exe" --crash-test illegal-instruction; then
            echo "::error::--crash-test did not stop the app"; exit 1
          fi
          "$exe" --crash-report > report.md
          cat report.md
          grep -q '\*\*Crash\*\* `CRASH: .*(illegal instruction) at 0x' report.md
          # Windows also writes the call stack: the crash test's callers are in lowkey.exe.
          if [ "$RUNNER_OS" = Windows ]; then
            grep -q 'called from 0x[0-9A-F]* = lowkey.exe+0x' report.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: lowkey-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            ${{ steps.image.outputs.target }}/release/bundle/appimage/*.AppImage
            ${{ steps.image.outputs.target }}/release/bundle/deb/*.deb
            ${{ steps.image.outputs.target }}/release/bundle/rpm/*.rpm
            ${{ steps.image.outputs.target }}/release/bundle/nsis/*.exe
            ${{ steps.image.outputs.target }}/release/bundle/msi/*.msi
            ${{ steps.image.outputs.target }}/release/bundle/dmg/*.dmg
            ${{ steps.image.outputs.target }}/release/bundle/symbols/*.zip

  # A version tag: one release with the installers (Linux and Windows always, macOS when it built).
  release:
    name: GitHub Release
    # Also when a build did not finish (macOS without a runner): the files are checked below.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          mapfile -t files < <(find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*-debug-symbols.zip' \) | sort)
          # Linux and Windows must be there; macOS may be missing.
          for ext in AppImage deb rpm exe msi zip; do
            printf '%s\n' "${files[@]}" | grep -q "\.$ext\$" || { echo "::error::no .$ext installer"; exit 1; }
          done
          if printf '%s\n' "${files[@]}" | grep -q '\.dmg$'; then
            notes="Installers for Linux (AppImage, .deb, .rpm), Windows (.exe installer, .msi) and macOS on Apple Silicon (.dmg).
          They are not signed: Windows SmartScreen asks once (More info → Run anyway); on macOS run
          \`xattr -dr com.apple.quarantine /Applications/Lowkey.app\` after copying the app."
          else
            notes="Installers for Linux (AppImage, .deb, .rpm) and Windows (.exe installer, .msi). No macOS build in
          this release: GitHub had no macOS machine free for it. They are not signed: Windows SmartScreen
          asks once (More info → Run anyway)."
          fi
          notes="$notes

          The file *x64-debug-symbols.zip is not an installer: it turns the addresses in a Windows crash
          report (lowkey.exe+0x…) into function names."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Lowkey ${GITHUB_REF_NAME#v}" \
            --notes "$notes" --generate-notes "${files[@]}"
