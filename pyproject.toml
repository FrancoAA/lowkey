[project]
name = "open-whisper"
version = "0.1.0"
description = "Local, open-source speech-to-text web app (faster-whisper + FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==15.1.0",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.4.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
]
bench = [
    "jiwer>=4.0.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses a real Whisper model (downloads it on first run)"]
