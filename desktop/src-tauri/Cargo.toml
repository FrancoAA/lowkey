[package]
name = "lowkey"
version = "0.12.0"
description = "Local, open-source speech to text: desktop app"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "lowkey_lib"
crate-type = ["rlib"]

[[bin]]
name = "lowkey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS (the rounded dictation overlay).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
anyhow = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json", "multipart"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.16"
hound = "3"
# Live preview (Whistle): load the engine library at run time, check downloads, read its wheel.
libloading = "0.8"
sha2 = "0.10"
flate2 = "1"
# AI notes: unpack the pinned llama.cpp release (.tar.gz), name the meeting's language.
tar = "0.4"
# The built-in server's key, from the system's random generator.
getrandom = "0.3"
# The host of an own server's address, parsed as reqwest parses it (the same crate).
url = "2"
# Vocabulary: whole-word, case-insensitive replacement of "sounds like" spellings.
regex = "1"
whatlang = "0.16"
# Calendar links: recurring events (RRULE) and time zones of a pasted iCal address (src/calendar.rs).
chrono = "0.4"
chrono-tz = "0.10"
rrule = "0.14"
# Meeting audio, kept on request: one stereo Ogg Opus file (src/recording.rs). libopus is built
# from the source that audiopus_sys bundles and linked statically (see .cargo/config.toml).
opus = "=0.3.1"
audiopus_sys = { version = "=0.2.2", features = ["static"] }
ogg = "=0.9.2"

log = "0.4"

# raw-api: ggml's device registry (src/gpu.rs).
# GPU backend per OS: Vulkan (AMD/Intel/NVIDIA) on Linux, Metal on macOS. Windows: Vulkan with
# the `windows-gpu` feature (the releases: it needs the Vulkan SDK, see .github/workflows), else
# the CPU (`make desktop-windows`).
[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", features = ["raw-api"] }

# Parakeet (NVIDIA, CC-BY-4.0 weights) through sherpa-onnx (Apache-2.0), linked statically with
# onnxruntime. Exact version: desktop/scripts/sherpa-onnx.sh pins the archive of this release.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
sherpa-onnx = "=2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal", "raw-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan", "openmp", "raw-api"] }
# Same versions as wry/tauri use: only to set the overlay webview's GTK size request.
gtk = "0.18"
webkit2gtk = "2.0"
# Screen video with meetings: the ScreenCast portal (async-io, as the zbus of single-instance:
# no second D-Bus runtime) (its file descriptor and signals: libc, below).
ashpd = { version = "0.12", default-features = false, features = ["async-std"] }
# Names from the call app: its window read through the accessibility bus (AT-SPI), read-only
# (src/callnames.rs). async-io, as ashpd and single-instance use: no second D-Bus runtime.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# The screen video's encoder process (Linux), and the end of the app: _exit, after everything
# is saved (see `exit_now` in src/app.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Crash reports (src/crash.rs): the exception filter, the log as stderr, the system's name, and
# the browser for a report. Already in the lock file (through tauri).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Start at login on macOS/Windows (Linux writes its XDG autostart entry itself: src/autostart.rs).
tauri-plugin-autostart = "2"
enigo = "0.6"
arboard = "3"

[features]
default = []
# Embed the built UI (frontend/dist). `tauri build` turns it on; for a plain cargo build use
# `cargo build --release --features custom-protocol` (see Makefile: make desktop).
custom-protocol = ["tauri/custom-protocol"]
# Windows: whisper.cpp on the GPU through Vulkan. Needs VULKAN_SDK (headers, glslc, vulkan-1.lib)
# at build time; vulkan-1.dll is loaded only when it is there (src/gpu.rs, build.rs).
windows-gpu = ["whisper-rs/vulkan"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
